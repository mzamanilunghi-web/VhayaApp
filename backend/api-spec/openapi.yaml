      properties:
        userId:
          type: string
        displayName:
          type: string
        email:
          type: [string, "null"]
      required: [userId, displayName, email]
    DriverOnlineLocationInput:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required: [latitude, longitude]
    DriverOnlineLocationResponse:
      type: object
      properties:
        updatedAt:
          type: integer
          format: int64
      required: [updatedAt]
    AdminOnlineDriver:
      type: object
      properties:
        driverId:
          type: string
        displayName:
          type: string
        city:
          type: [string, "null"]
        vehicle:
          type: [string, "null"]
        vehicleColor:
          type: [string, "null"]
        location:
          oneOf:
            - $ref: "#/components/schemas/OnlineDriverLocation"
            - type: "null"
        locationState:
          type: string
          enum: [current, stale, waiting]
        lastLocationAt:
          type: ["integer", "null"]
          format: int64
      required:
        - driverId
        - displayName
        - city
        - vehicle
        - vehicleColor
        - location
        - locationState
        - lastLocationAt
    OnlineDriverLocation:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        updatedAt:
          type: integer
          format: int64
      required: [latitude, longitude, updatedAt]
    AdminOnlineDriversResponse:
      type: object
      properties:
        generatedAt:
          type: integer
          format: int64
        drivers:
          type: array
          items:
            $ref: "#/components/schemas/AdminOnlineDriver"
      required: [generatedAt, drivers]
    AdminPersonDetail:
      type: object
      properties:
        person:
          $ref: "#/components/schemas/AdminPersonSummary"
        rides:
          type: array
          items:
            $ref: "#/components/schemas/AdminRideSummary"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/AdminReviewRecord"
      required: [person, rides, reviews]
    CreateAdminReviewRequest:
      type: object
      properties:
        subjectType:
          $ref: "#/components/schemas/ReviewSubjectType"
        outcome:
          $ref: "#/components/schemas/ReviewOutcome"
