kind = "web"
previewPath = "/"
title = "Vhaya Admin"
description = "A staff-only console for reviewing pending driver applications and recording manual checks for documents received by email, using the existing Vhaya API."
version = "1.0.0"
id = "artifacts/vhaya-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19935

[services.development]
run = "pnpm --filter @workspace/vhaya-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vhaya-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/vhaya-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19935"
BASE_PATH = "/"
